<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#041827">
  <title>釣れた！感度テスト</title>
  <style>*{box-sizing:border-box}body{color:#f7fcff;background:radial-gradient(circle at 50% 0,#16738d,#082c43 45%,#03131f);min-height:100svh;margin:0;font-family:system-ui,-apple-system,Hiragino Sans,sans-serif}.app{width:min(100%,540px);min-height:100svh;padding:calc(24px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));text-align:center;align-content:center;gap:16px;margin:auto;display:grid}.eyebrow{color:#79e8ff;letter-spacing:.15em;margin:0;font-size:12px;font-weight:900}h1{margin:0;font-size:38px}p{color:#c8e1e9;margin:0;line-height:1.7}.panel{background:#071f31d9;border:1px solid #9cecff33;border-radius:26px;padding:20px;box-shadow:0 22px 60px #0008}.step{color:#79e8ff;font-size:12px;font-weight:900}.demo{color:#fff;background:#ffffff09;border-radius:18px;place-items:center;min-height:80px;margin-top:7px;font-size:48px;font-weight:900;display:grid}.instruction{color:#fff;margin:13px 0 0;font-size:23px;font-weight:950;line-height:1.35}.detail{color:#c8e1e9;min-height:76px;margin-top:8px;font-size:14px;line-height:1.65}.status{color:#fff;background:#345264;border-radius:14px;min-height:52px;margin-top:12px;padding:13px;font-size:17px;font-weight:950}.status.wait{background:#5d3d32}.status.go{color:#06291e;background:#83efb7;font-size:25px;animation:.18s ease-in-out 5 alternate go}@keyframes go{to{background:#fff06e;transform:scale(1.035)}}.status.done{color:#06291e;background:#83efb7}.progress{background:#ffffff17;border-radius:99px;height:9px;overflow:hidden}.progress span{background:linear-gradient(90deg,#72e6ff,#76efb1);width:0;height:100%;transition:width .3s;display:block}button{color:#052638;background:linear-gradient(135deg,#a6f4ff,#67dcf8);border:0;border-radius:17px;width:100%;min-height:56px;padding:12px;font:900 16px inherit;box-shadow:0 12px 30px #00111f88}button:disabled{opacity:.48}button.secondary{color:#f7fcff;box-shadow:none;background:#ffffff10;border:1px solid #ffffff28}.safe{font-size:12px}.result{white-space:pre-wrap;overflow-wrap:anywhere;color:#9ed9e8;text-align:left;background:#020d15;border-radius:14px;margin-top:10px;padding:12px;font:11px ui-monospace,monospace}.buttons{gap:9px;margin-top:12px;display:grid}[hidden]{display:none!important}</style>
  <script type="module" crossorigin src="../assets/calibrate-DMYwTOnj.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/sensors-PKhmy6Gy.js">
</head>
<body><main class="app">
  <p class="eyebrow">DEVICE CALIBRATION • P0-8</p><h1>約1分の感度テスト</h1>
  <p id="intro">画面の指示に合わせて、6種類の動きを2回ずつ行います。周囲を確認し、スマホをしっかり握ってください。</p>
  <div class="progress"><span id="progress"></span></div>
  <section class="panel"><div id="step" class="step">開始前</div><div id="demo" class="demo">📱</div><p id="instruction" class="instruction">準備ができたら開始</p><p id="detail" class="detail">開始後も、あなたがボタンを押すまで測定されません。</p><div id="status" class="status">名前・位置情報は取得しません</div><button id="trial-start" class="secondary" hidden>この動きを測る</button></section>
  <button id="start">安全を確認して測定開始</button>
  <section id="done" hidden><h2>測定完了！</h2><p>「結果をコピー」を押し、この文章を開発担当者へ送ってください。</p><div class="buttons"><button id="copy">結果をコピー</button><button id="share" class="secondary">結果を共有</button></div><div id="result" class="result"></div></section>
  <p class="safe">大きく振る必要はありません。顔・人・物から離し、座ったまま行えます。</p>
</main></body></html>
